name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  gamestudio:
    name: GameStudio (.NET)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Windows, not Linux: GameStudio.App targets net10.0-windows for WPF. Core and Mcp are
      # portable, but building the whole solution in one job is what keeps them honest about it.
      - name: Restore
        run: dotnet restore Sources/GameStudio/GameStudio.slnx

      - name: Build
        run: dotnet build Sources/GameStudio/GameStudio.slnx -c Release --no-restore

      - name: Test
        run: >
          dotnet test Sources/GameStudio/GameStudio.Core.Tests/GameStudio.Core.Tests.csproj
          -c Release --no-build --verbosity normal

  engine:
    name: Engine and tools (C++)
    runs-on: windows-latest
    # This started out informational, on the assumption that a 2013-era Win32 codebase would not
    # build unattended. With the toolset retargeted to v143, the pre-build event guarded and MFC
    # installed, it does -- so it is a real gate. DirectX stays off (SE1_D3D is not defined),
    # which is why no external SDK is needed beyond MFC.
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      # Several projects need MFC -- the game logic in EntitiesMP, the editors, and the small
      # tools -- and the hosted runners do not ship it. Without this the build stops at MSB8041
      # and only the engine and its libraries ever get checked.
      - name: Install MFC
        run: |
          $root = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $path = & "$root\vswhere.exe" -latest -property installationPath
          $p = Start-Process -FilePath "$root\vs_installer.exe" -Wait -PassThru -ArgumentList @(
            "modify", "--installPath", "`"$path`"",
            "--add", "Microsoft.VisualStudio.Component.VC.ATLMFC",
            "--quiet", "--norestart", "--nocache")
          # 3010 is success with a reboot pending, which does not matter on a one-shot runner.
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "Visual Studio installer exited with $($p.ExitCode)"
          }

      # Built through the solution rather than as bare projects, for two reasons that both bite.
      # $(SolutionDir) is what the Engine project uses to find Tools.Win32 (bison, flex) and Bin
      # (ecc) -- building a .vcxproj alone points it at Sources/Engine and none of them resolve.
      # And the solution declares the dependency on Ecc, so the entity class compiler gets built
      # before the code generation step that needs it.
      - name: Build
        run: >
          msbuild Sources/All.sln
          /p:Configuration=Release /p:Platform=Win32
          /m /verbosity:minimal
