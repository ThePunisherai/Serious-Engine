name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  gamestudio:
    name: GameStudio (.NET)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Windows, not Linux: GameStudio.App targets net10.0-windows for WPF. Core and Mcp are
      # portable, but building the whole solution in one job is what keeps them honest about it.
      - name: Restore
        run: dotnet restore Sources/GameStudio/GameStudio.slnx

      - name: Build
        run: dotnet build Sources/GameStudio/GameStudio.slnx -c Release --no-restore

      - name: Test
        run: >
          dotnet test Sources/GameStudio/GameStudio.Core.Tests/GameStudio.Core.Tests.csproj
          -c Release --no-build --verbosity normal

  engine:
    name: Engine (C++)
    runs-on: windows-latest
    # This started out informational, on the assumption that a 2013-era Win32 codebase would not
    # build unattended. With the toolset retargeted to v143, the pre-build event guarded and MFC
    # installed, it does -- so it is a real gate. DirectX stays off (SE1_D3D is not defined),
    # which is why no external SDK is needed beyond MFC.
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      # Gated: the engine and everything it needs. This covers every engine change, and the
      # solution target pulls in Ecc first because the dependency is declared there -- which
      # matters, since $(SolutionDir) is how the Engine project finds Tools.Win32 (bison, flex)
      # and Bin (ecc), and a bare .vcxproj build points it at the wrong directory.
      - name: Build engine
        run: >
          msbuild Sources/All.sln /t:Engine
          /p:Configuration=Release /p:Platform=Win32
          /m /verbosity:minimal

      # Not gated, and the reason is the image rather than the code. The game logic, the editors
      # and the small tools need MFC for the v143 toolset these projects pin. The runner carries
      # Visual Studio 18, whose ATLMFC component installs MFC for its own newer toolset, so
      # MSB8041 stands even after installing it -- and the version-pinned component IDs that would
      # fix it are too brittle to depend on.
      #
      # It still runs, because the compiler output is worth having. Read the summary below, not
      # the step's own status: continue-on-error reports a failed step as successful.
      - name: Build everything else (informational)
        continue-on-error: true
        shell: pwsh
        run: |
          msbuild Sources/All.sln /p:Configuration=Release /p:Platform=Win32 `
            /m /verbosity:minimal /nologo `
            /flp:LogFile=build-errors.log`;ErrorsOnly`;Verbosity=minimal
          $code = $LASTEXITCODE
          if (Test-Path build-errors.log) {
            Write-Host "----- errors -----"
            Get-Content build-errors.log | Select-Object -First 60
          }
          exit $code
