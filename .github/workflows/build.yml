name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  gamestudio:
    name: GameStudio (.NET)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Windows, not Linux: GameStudio.App targets net10.0-windows for WPF. Core and Mcp are
      # portable, but building the whole solution in one job is what keeps them honest about it.
      - name: Restore
        run: dotnet restore Sources/GameStudio/GameStudio.slnx

      - name: Build
        run: dotnet build Sources/GameStudio/GameStudio.slnx -c Release --no-restore

      - name: Test
        run: >
          dotnet test Sources/GameStudio/GameStudio.Core.Tests/GameStudio.Core.Tests.csproj
          -c Release --no-build --verbosity normal

  engine:
    name: Engine and tools (C++)
    runs-on: windows-latest
    # This started out informational, on the assumption that a 2013-era Win32 codebase would not
    # build unattended. It does: with the toolset retargeted to v143 and the pre-build event
    # guarded, all twenty projects compile and link from a clean checkout. So it is a real gate
    # -- a break here is a break, not a curiosity. DirectX stays off (SE1_D3D is not defined),
    # which is why no external SDK is needed.
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      # Built through the solution rather than as a bare project, for two reasons that both bite.
      # $(SolutionDir) is what the Engine project uses to find Tools.Win32 (bison, flex) and Bin
      # (ecc) -- building the .vcxproj alone points it at Sources/Engine and none of them resolve.
      # And the solution declares Engine's dependency on Ecc, so the entity class compiler gets
      # built before the code generation step that needs it.
      # The whole solution, not just the engine: the toolset retarget touched all twenty projects,
      # and a break in the game or the editors matters as much as one in the engine. All twenty do
      # build on a hosted runner, MFC editors included, so this is gated rather than informational.
      - name: Build
        run: >
          msbuild Sources/All.sln
          /p:Configuration=Release /p:Platform=Win32
          /m /verbosity:minimal
